services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: smartbus
      MYSQL_USER: smartbus
      MYSQL_PASSWORD: smartbus_dev_only
      MYSQL_ROOT_PASSWORD: root_dev_only
    ports: ["3306:3306"]
    volumes: ["smartbus_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usmartbus", "-psmartbus_dev_only"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartbus
      SPRING_DATASOURCE_USERNAME: smartbus
      SPRING_DATASOURCE_PASSWORD: smartbus_dev_only
      SMARTBUS_JWT_SECRET: local-development-secret-change-before-deploy-123456
    ports: ["8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  smartbus_mysql:
