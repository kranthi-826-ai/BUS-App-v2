spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartbus}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

server:
  port: 8080

smartbus:
  external-tracking:
    enabled: ${EXTERNAL_TRACKING_ENABLED:false}
    provider: ${EXTERNAL_TRACKING_PROVIDER:none}
    base-url: ${EXTERNAL_TRACKING_BASE_URL:}
    api-token: ${EXTERNAL_TRACKING_API_TOKEN:}
    poll-seconds: ${EXTERNAL_TRACKING_POLL_SECONDS:30}
